# model architecture
# `name` picks which backbone of that modality to build; see
# `secs.models.registry.available_encoders()` for what is registered.
encoders:
  smiles:
    name: molformer
    pretrained: True
    freeze_encoder: True
  c_nmr:
    name: transformer
    freeze_encoder: False
  ir:
    name: cnn
    freeze_encoder: False
  h_nmr:
    name: cnn
    freeze_encoder: False
  hsqc:
    name: cnn
    freeze_encoder: False


embedding_size: 512
projection_heads:
  # this determines whether the projection head is added to the model
  smiles_is_on: True
  c_nmr_is_on: True
  ir_is_on: True
  h_nmr_is_on: True
  hsqc_is_on: True
  # freeze projection heads
  c_nmr_freeze: True
  ir_freeze: True
  smiles_freeze: True
  h_nmr_freeze: False
  hsqc_freeze: False
  # default projection heads for each modality
  smiles:
    dims: [768, "${model.embedding_size}"]
    activation: LeakyReLU
  c_nmr:
    dims: [256, "${model.embedding_size}"]
    activation: LeakyReLU
  ir:
    dims: [512, "${model.embedding_size}"]
    activation: LeakyReLU
  h_nmr:
    dims: [128, "${model.embedding_size}"]
    activation: LeakyReLU
  hsqc:
    dims: [1024, "${model.embedding_size}"]
    activation: LeakyReLU

optimizer:
  lr: 0.0001
  weight_decay: 0.0001

loss:
  temperature: 0.07
  symmetric: True

# compile model for faster training with pytorch 2.0
compile: false
